name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Only the browser, from Playwright's own download servers. The runner image already has the
      # system libraries Chromium needs (it ships Google Chrome), and `--with-deps` broke CI whenever
      # the runner couldn't reach Ubuntu's package mirrors.
      - name: Install Chromium for e2e
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install chromium && exit 0
            echo "Attempt $attempt failed; retrying in 20 seconds"
            sleep 20
          done
          exit 1
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
